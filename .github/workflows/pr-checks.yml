# Pull request quality checks and preview deployment.
#
# Triggered on PRs targeting `main` or any `base/**` branch.
#
# CI jobs:
#   Type Check    — pnpm install; pnpm check
#   Unit Tests    — pnpm install; pnpm test:unit (vitest run scripts/, no dist)
#   Build Site    — full clone, pnpm install; CI=true zfb build
#   HTML Validate — needs build-site; pnpm check:html
#   Check Links   — needs build-site; check-links.js --strict-broken --strict-absolute
#   E2E Tests     — needs build-site; pnpm test:e2e (vitest reads dist/)
#   Preview Deploy — needs build-site; wrangler versions upload + PR comment
#
# zcss is a pure-static site (no _worker.js). Preview uses
# `wrangler versions upload --preview-alias` with `preview_urls = true` in
# wrangler.toml to generate a stable *.workers.dev alias URL.
#
# Concurrency: cancel in-progress runs for the same PR to save resources.

name: PR Checks

on:
  pull_request:
    branches:
      - main
      - 'base/**'

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: MDX format check
  # ---------------------------------------------------------------------------
  # mdx-formatter --check (pinned devDep binary, NOT dlx — dlx would pull the
  # stale `latest`). Config (.mdx-formatter.json) ignores CssPreview /
  # TailwindPreview demo blocks and excludes the generated claude* docs.
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check MDX formatting
        run: pnpm format:md:check

  # ---------------------------------------------------------------------------
  # Job 0a: Pin parity check
  # ---------------------------------------------------------------------------
  # Pure-Node script — reads package.json only, no pnpm install needed.
  # Verifies the @takazudo/zfb and @takazudo/zudo-doc package groups stay in
  # lockstep (a bump to one without the others is a CI error).
  check-pin-parity:
    name: Pin Parity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check pin parity
        run: node scripts/check-pin-parity.mjs

  # ---------------------------------------------------------------------------
  # Job 0b: Template drift check
  # ---------------------------------------------------------------------------
  # Compares scaffolded files against the create-zudo-doc devDep templates.
  # Intentional zcss divergences are listed in .template-drift-allowlist.
  check-template-drift:
    name: Template Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check template drift
        run: pnpm check:template-drift

  # ---------------------------------------------------------------------------
  # Job 1: Type checking
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checking
        run: pnpm check

  # ---------------------------------------------------------------------------
  # Job 1a: Unit tests (vitest run scripts/ — pure unit tests, no dist needed)
  # ---------------------------------------------------------------------------
  # Covers the port-rotation helper (scripts/lib/find-free-port.mjs, incl. its
  # WSL2 connect-timeout behavior) and check-links. Independent of the build.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit

  # ---------------------------------------------------------------------------
  # Job 2: Build site (full clone — needed for SSG meta dates)
  # ---------------------------------------------------------------------------
  build-site:
    name: Build Site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: CI=true pnpm exec zfb build

      # Artifact (not actions/cache) for the within-run dist handoff: the cache
      # service is eventually consistent and downstream restores ~19s after a
      # successful save missed twice on 2026-06-11 (issue #107). Artifacts are
      # run-scoped with no propagation lag; 1-day retention since nothing
      # outside this run ever reads it.
      - name: Upload site build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 3: HTML validate (block-in-inline guard)
  # ---------------------------------------------------------------------------
  html-validate:
    name: HTML Validate
    needs: [build-site]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install deps (no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download site build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run html-validate
        run: pnpm check:html

  # ---------------------------------------------------------------------------
  # Job 4: Link check
  # ---------------------------------------------------------------------------
  check-links:
    name: Check Links
    needs: [build-site]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download site build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Check links (strict)
        run: node scripts/check-links.js --strict-broken --strict-absolute --allowlist=.check-links-allowlist

  # ---------------------------------------------------------------------------
  # Job 5: E2E tests (vitest reads dist/ HTML — no browser needed)
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E Tests
    needs: [build-site]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download site build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run E2E tests
        run: pnpm test:e2e

  # ---------------------------------------------------------------------------
  # Job 6: Preview deploy and comment on PR
  # ---------------------------------------------------------------------------
  preview:
    name: Preview Deploy
    needs: [build-site]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download site build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Guard: assert the built HTML has root-relative asset URLs.
      # base="/" → href="/assets/..." and src="/assets/...".
      - name: Assert root asset URLs in built HTML
        run: |
          set -euo pipefail
          HTML_FILE="dist/index.html"
          grep -qE 'href="/assets/' "$HTML_FILE" \
            || { echo "::error::Built HTML missing root stylesheet href (expected href=\"/assets/...)"; exit 1; }
          grep -qE 'src="/assets/' "$HTML_FILE" \
            || { echo "::error::Built HTML missing root islands script src (expected src=\"/assets/...)"; exit 1; }
          echo "OK: built HTML has root asset URLs"

      - name: Deploy PR preview to Cloudflare Workers
        id: cf-deploy
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          ALIAS="pr-${PR_NUMBER}"
          # `wrangler versions upload --preview-alias` creates a stable
          # *.workers.dev preview URL (requires preview_urls = true in wrangler.toml).
          # Capture output and parse the stable alias URL (subdomain starts with
          # the alias) — not the per-version hash URL — for a stable PR comment.
          DEPLOY_LOG=$(mktemp)
          npx wrangler@4 versions upload \
            --preview-alias "$ALIAS" \
            2>&1 | tee "$DEPLOY_LOG"
          DEPLOY_URL=$(grep -oE "https://${ALIAS}-[a-z0-9.-]+\.workers\.dev" "$DEPLOY_LOG" | head -1)
          # Fallback to any *.workers.dev URL wrangler printed (alias format
          # varies; some accounts emit only a version URL).
          [ -z "$DEPLOY_URL" ] && DEPLOY_URL=$(grep -oE "https://[a-z0-9.-]+\.workers\.dev" "$DEPLOY_LOG" | head -1)
          if [ -z "$DEPLOY_URL" ]; then
            # The upload itself succeeded (asserted by the wrangler exit code
            # above); only the preview-URL alias is unavailable — e.g. the
            # worker has no workers.dev subdomain enabled on the account. The
            # PR preview-URL comment is best-effort, so warn and continue
            # rather than failing the whole check on a cosmetic gap.
            echo "::warning::No *.workers.dev preview URL parsed from wrangler output; skipping PR preview-URL comment (deploy succeeded)."
          else
            echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
            echo "Preview URL: $DEPLOY_URL"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        if: steps.cf-deploy.outputs.deploy_url != ''
        uses: actions/github-script@v8
        env:
          DEPLOY_URL: ${{ steps.cf-deploy.outputs.deploy_url }}
        with:
          script: |
            const deployUrl = process.env.DEPLOY_URL;
            const prNumber = context.issue.number;
            const marker = '<!-- cf-preview-pr -->';

            const body = [
              marker,
              `## Cloudflare Workers Preview`,
              '',
              `Preview deployment is ready.`,
              '',
              `| | URL |`,
              `|---|---|`,
              `| Preview | ${deployUrl} |`,
              '',
              `Built from commit: \`${context.sha.substring(0, 7)}\``,
            ].join('\n');

            // Upsert: update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log(`Updated existing preview comment (id: ${existing.id})`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              console.log('Created new preview comment');
            }
